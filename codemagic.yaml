workflows:
  ios-build-check:
    name: Quantum Aux - Build Check
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Test bridge logic
        script: |
          set -e
          swift test

      - name: Build iOS app
        script: |
          set -e
          xcodebuild \
            -project QuantumAuxBridge.xcodeproj \
            -scheme QuantumAuxBridge \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
